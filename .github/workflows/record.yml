name: Record a live run

# Calls Claude for every case with both prompt versions (agent and judge), saves the replies to
# recordings/, rebuilds the demo page from them, and commits both. Needs the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOLIVE_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Live runs (prompt v1 and v2, 3 runs of 30 sections each, Claude agent + Claude judge)
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "Set the ANTHROPIC_API_KEY repo secret first"; exit 1; }
          rm -f recordings/*.jsonl
          for v in v1 v2; do
            set +e
            golive run evals/golive.live.$v.yml --out reports/live-$v
            code=$?
            set -e
            echo "## Prompt $v" >> "$GITHUB_STEP_SUMMARY"
            cat reports/live-$v/report.md >> "$GITHUB_STEP_SUMMARY"
            # 0 go, 1 no-go, 2 partial are all results worth keeping; 3 is a config error
            test "$code" -ne 3
            # keep only a complete recording: 90 sections (30 cases x 3 runs), none crashed
            test "$(wc -l < recordings/agent_$v.jsonl)" -eq 90 || { echo "incomplete $v recording, not committing"; exit 1; }
          done
      - name: Keep the reports and recordings for diagnosis, even when the run fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-run
          path: |
            reports/
            recordings/
          if-no-files-found: ignore
      - name: Rebuild the demo page from the recordings
        run: GOLIVE_LIVE= python scripts/build_demo.py
      - name: Commit the recordings and the demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recordings docs
          git commit -m "Record live run" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
          # publish docs/ as the gh-pages branch, which GitHub Pages serves
          git fetch origin gh-pages
          c=$(git commit-tree "$(git rev-parse HEAD:docs)" -p origin/gh-pages -m "Publish the demo page")
          git push origin "$c:refs/heads/gh-pages"
          # pushes made with GITHUB_TOKEN do not start CI; the next push by a person does
