name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: The no-model baseline must be blocked (no-go)
        run: |
          set +e
          golive run evals/golive.baseline.yml --out reports/baseline
          test $? -eq 1

  gate:
    # Grades the last recorded live run of prompt v2 (agent and judge). Fails the build on no-go.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        if: hashFiles('recordings/agent_v2.jsonl') != ''
        uses: pg2342-hub/golive-gate@5ed50a1d8880c26624d477f53bfb77f03524bb58
        with:
          config: evals/golive.v2.yml
          extras: claude
      - if: hashFiles('recordings/agent_v2.jsonl') != ''
        run: echo "Graduation decision on the recorded run was ${{ steps.gate.outputs.decision }}"
