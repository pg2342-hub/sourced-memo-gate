[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourced-memo-gate"
version = "0.1.0"
description = "Go-live gate for an AI research-synthesis agent on a consulting engagement"
requires-python = ">=3.10"
dependencies = [
  "golive-gate[claude] @ git+https://github.com/pg2342-hub/golive-gate@5ed50a1d8880c26624d477f53bfb77f03524bb58",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["memo"]

[tool.setuptools.package-data]
memo = ["corpus.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# the page template and the shared house-style helper carry long lines of HTML
"scripts/build_demo.py" = ["E501"]
"scripts/demo_chrome.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["memo"]
known-third-party = ["golive_gate"]
